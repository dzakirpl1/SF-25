name: personal_os
description: "Satu aplikasi untuk mengelola catatan, tugas, waktu, uang, kesehatan, belajar, dan kehidupan sehari-hari"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.3
  intl: ^0.20.2
  fl_chart: ^0.68.0
  uuid: ^4.4.0

dev_dependencies:
  test: ^1.25.8
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
